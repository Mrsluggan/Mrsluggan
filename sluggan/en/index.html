    <script type="application/ld+json">
    {
          "@context": "https://schema.org",
          "@type": "FAQPage",
          "mainEntity": [
                {
                      "@type": "Question",
                      "name": "What does it cost?",
                      "acceptedAnswer": {
                            "@type": "Answer",
                            "text": "Depends entirely on scope. A simple website is a lot cheaper than a custom app with logins and a backend. Get in touch and you'll get a free quote with a fixed price, before anything gets built."
                      }
                },
                {
                      "@type": "Question",
                      "name": "How long does it take?",
                      "acceptedAnswer": {
                            "@type": "Answer",
                            "text": "A straightforward website is often a couple of weeks. Something with a backend, accounts, or a mobile app takes longer. A realistic timeline is part of the plan."
                      }
                },
                {
                      "@type": "Question",
                      "name": "Do you build for both iOS and Android?",
                      "acceptedAnswer": {
                            "@type": "Answer",
                            "text": "Yes. Depending on the project, React Native or similar cross-platform tools cover both, or native development where that's genuinely the better fit."
                      }
                },
                {
                      "@type": "Question",
                      "name": "I don't have a clear idea yet, is that a problem?",
                      "acceptedAnswer": {
                            "@type": "Answer",
                            "text": "Not at all. Most projects start as a rough idea and get shaped into something concrete together before any code gets written."
                      }
                },
                {
                      "@type": "Question",
                      "name": "Can you take over or improve something that already exists?",
                      "acceptedAnswer": {
                            "@type": "Answer",
                            "text": "Yes — a website or app someone else built, one built in-house, or something that's stalled halfway through."
                      }
                },
                {
                      "@type": "Question",
                      "name": "Do I have to sign a long contract?",
                      "acceptedAnswer": {
                            "@type": "Answer",
                            "text": "No. Work is scoped and priced per project, not as an ongoing retainer."
                      }
                },
                {
                      "@type": "Question",
                      "name": "What if it's just a small job, like one page?",
                      "acceptedAnswer": {
                            "@type": "Answer",
                            "text": "That's fine. Small and one-off jobs are welcome, not just big builds."
                      }
                }
          ]
    }
    </script>
