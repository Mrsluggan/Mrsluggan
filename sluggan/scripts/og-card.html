<!doctype html>
<!-- Source for public/og.png. Rendered by `npm run og:build`. -->
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <style>
        @font-face {
            font-family: 'Space Grotesk';
            font-weight: 300 700;
            src: url(../public/fonts/space-grotesk-latin.woff2) format('woff2');
        }
        @font-face {
            font-family: 'Inter';
            font-weight: 100 900;
            src: url(../public/fonts/inter-latin.woff2) format('woff2');
        }

        :root {
            --bg: #ffffff;
            --panel: #f6f7f9;
            --border: #e2e5eb;
            --text: #14181f;
            --muted: #565d6b;
            --faint: #8992a1;
            --accent: #2b4fe0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            width: 1200px;
            height: 630px;
            overflow: hidden;
            background:
                radial-gradient(760px 520px at 88% 6%, rgba(43, 79, 224, 0.10), transparent 62%),
                var(--bg);
            color: var(--text);
            font-family: 'Space Grotesk', system-ui, sans-serif;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            /* generous; Slack and LinkedIn crop the edges a little */
            padding: 62px 72px 58px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 16px;
            position: relative;
        }
        .brand .mark {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: var(--accent);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 28px;
        }
        .brand-name {
            font-size: 27px;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.1;
        }
        .brand-sub {
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            color: var(--faint);
        }

        .middle { position: relative; }

        h1 {
            font-size: 80px;
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.08;
            max-width: 920px;
        }
        h1 .accent { color: var(--accent); }

        .role {
            font-family: 'Inter', sans-serif;
            font-size: 23px;
            color: var(--muted);
            margin-top: 26px;
            letter-spacing: 0.01em;
        }

        .chips {
            display: flex;
            gap: 11px;
            margin-top: 34px;
        }
        .chip {
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 500;
            color: var(--muted);
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 100px;
            padding: 9px 18px;
        }

        .foot {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            font-family: 'Inter', sans-serif;
            font-size: 19px;
            position: relative;
            border-top: 1px solid var(--border);
            padding-top: 28px;
        }
        .url { color: var(--accent); font-weight: 700; letter-spacing: 0.01em; }
        .motto { color: var(--faint); font-size: 16px; }
    </style>
</head>
<body>
    <div class="brand">
        <div class="mark">S</div>
        <div>
            <div class="brand-name">Sluggan AB</div>
            <div class="brand-sub">Uppsala, Sweden</div>
        </div>
    </div>

    <div class="middle">
        <h1>Straightforward <span class="accent">software</span> for small businesses.</h1>
        <div class="role">Websites · Web applications · Mobile apps</div>
        <div class="chips">
            <div class="chip">Web development</div>
            <div class="chip">App development</div>
            <div class="chip">Fixed pricing</div>
        </div>
    </div>

    <div class="foot">
        <div class="url">sluggan.com</div>
        <div class="motto">Simple, dependable software — no agency overhead.</div>
    </div>
</body>
</html>
