<!doctype html>
<!-- Source for public/og.png. Rendered by `npm run og:build`. -->
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <style>
        @font-face {
            font-family: 'Fraunces';
            font-weight: 300 700;
            src: url(../public/fonts/fraunces-latin.woff2) format('woff2');
        }
        @font-face {
            font-family: 'Inter';
            font-weight: 100 900;
            src: url(../public/fonts/inter-latin.woff2) format('woff2');
        }

        :root {
            --bg: #faf8f3;
            --border: #ddd5c4;
            --text: #211f1a;
            --muted: #5c5648;
            --faint: #8c8576;
            --accent: #a8451f;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            width: 1200px;
            height: 630px;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: 'Fraunces', Georgia, serif;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            /* generous; Slack and LinkedIn crop the edges a little */
            padding: 62px 72px 58px;
        }

        .brand {
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--accent);
        }

        .middle { position: relative; }

        h1 {
            font-size: 78px;
            font-weight: 500;
            letter-spacing: -0.02em;
            line-height: 1.1;
            max-width: 980px;
        }
        h1 .accent { color: var(--accent); font-style: italic; }

        .role {
            font-family: 'Inter', sans-serif;
            font-size: 22px;
            color: var(--muted);
            margin-top: 28px;
        }

        .foot {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            font-family: 'Inter', sans-serif;
            font-size: 19px;
            position: relative;
            border-top: 1px solid var(--border);
            padding-top: 28px;
        }
        .url { color: var(--accent); font-weight: 700; letter-spacing: 0.01em; }
        .motto { color: var(--faint); font-size: 16px; }
    </style>
</head>
<body>
    <div class="brand">Sluggan AB</div>

    <div class="middle">
        <h1>Web and app development for <span class="accent">small businesses</span>.</h1>
        <div class="role">Websites · Web applications · Mobile apps</div>
    </div>

    <div class="foot">
        <div class="url">sluggan.com</div>
        <div class="motto">Uppsala, Sweden</div>
    </div>
</body>
</html>
