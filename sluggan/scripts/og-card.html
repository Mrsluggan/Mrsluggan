<!doctype html>
<!-- Source for public/og.png. Rendered by `npm run og:build`. -->
<html lang="sv">
<head>
    <meta charset="UTF-8" />
    <style>
        @font-face {
            font-family: 'Fraunces';
            font-weight: 300 700;
            src: url(../public/fonts/fraunces-latin.woff2) format('woff2');
        }
        @font-face {
            font-family: 'Fraunces';
            font-style: italic;
            font-weight: 300 700;
            src: url(../public/fonts/fraunces-latin-italic.woff2) format('woff2');
        }
        @font-face {
            font-family: 'Newsreader';
            font-weight: 200 800;
            src: url(../public/fonts/newsreader-latin.woff2) format('woff2');
        }

        :root {
            --bg: #f6f1e6;
            --border: #211f1a;
            --text: #211f1a;
            --muted: #5b543f;
            --accent: #2f4a34;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            width: 1200px;
            height: 630px;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: 'Fraunces', Georgia, serif;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            /* generous; Slack and LinkedIn crop the edges a little */
            padding: 62px 72px 58px;
        }

        .brand {
            font-family: 'Newsreader', serif;
            font-size: 16px;
            font-weight: 600;
            font-style: italic;
            color: var(--accent);
        }

        .middle { position: relative; }

        h1 {
            font-size: 76px;
            font-weight: 500;
            letter-spacing: -0.02em;
            line-height: 1.1;
            max-width: 1000px;
        }
        h1 .accent { color: var(--accent); font-style: italic; font-weight: 400; }

        .role {
            font-family: 'Newsreader', serif;
            font-size: 23px;
            color: var(--muted);
            margin-top: 30px;
        }

        .foot {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            font-family: 'Newsreader', serif;
            font-size: 19px;
            position: relative;
            border-top: 2px solid var(--border);
            padding-top: 28px;
        }
        .url { color: var(--accent); font-weight: 700; letter-spacing: 0.01em; }
        .motto { color: var(--muted); font-size: 16px; font-style: italic; }
    </style>
</head>
<body>
    <div class="brand">Sluggan AB</div>

    <div class="middle">
        <h1>Hemsidor och appar för <span class="accent">småföretag</span>.</h1>
        <div class="role">Hemsidor · Webbapplikationer · Mobilappar</div>
    </div>

    <div class="foot">
        <div class="url">sluggan.com</div>
        <div class="motto">Uppsala, Sverige</div>
    </div>
</body>
</html>
