<!doctype html>
<!-- Source for public/og-photos.jpg. Rendered by `npm run og:build`. -->
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <style>
        @font-face {
            font-family: 'Space Grotesk';
            font-weight: 300 700;
            src: url(../public/fonts/space-grotesk-latin.woff2) format('woff2');
        }
        @font-face {
            font-family: 'JetBrains Mono';
            font-weight: 100 800;
            src: url(../public/fonts/jetbrains-mono-latin.woff2) format('woff2');
        }

        :root {
            --bg: #0a0b0d;
            --border: #262b33;
            --text: #ece9e2;
            --muted: #a2a8b2;
            --faint: #7b818b;
            --slime: #b6f04a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            width: 1200px;
            height: 630px;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: 'Space Grotesk', system-ui, sans-serif;
            position: relative;
        }

        /* tilted just enough to read as a stack */
        .wall {
            position: absolute;
            inset: 0;
            display: flex;
            gap: 16px;
            padding: 34px 30px;
            transform: rotate(-3deg) scale(1.16);
            transform-origin: center;
        }
        .col {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        /* stagger so it doesn't read as a grid */
        .col:nth-child(2) { margin-top: -54px; }
        .col:nth-child(3) { margin-top: 30px; }
        .col:nth-child(4) { margin-top: -26px; }

        .wall img {
            width: 100%;
            border-radius: 12px;
            border: 1px solid rgba(236, 233, 226, 0.10);
            object-fit: cover;
            display: block;
        }
        .tall { height: 300px; }
        .wide { height: 210px; }

        /* darken, hardest on the left where the type sits */
        .scrim {
            position: absolute;
            inset: 0;
            background:
                linear-gradient(100deg,
                    rgba(10, 11, 13, 0.97) 0%,
                    rgba(10, 11, 13, 0.94) 32%,
                    rgba(10, 11, 13, 0.72) 52%,
                    rgba(10, 11, 13, 0.55) 78%,
                    rgba(10, 11, 13, 0.62) 100%),
                radial-gradient(700px 480px at 6% 92%, rgba(182, 240, 74, 0.10), transparent 62%);
        }

        .content {
            position: absolute;
            inset: 0;
            padding: 62px 72px 58px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .brand svg { width: 38px; height: 38px; }
        .brand svg path { fill: var(--text); }
        .brand-name {
            font-size: 27px;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.1;
        }
        .brand-sub {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: var(--faint);
            letter-spacing: 0.05em;
        }

        .eyebrow {
            font-family: 'JetBrains Mono', monospace;
            font-size: 15px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--slime);
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .eyebrow::before {
            content: "";
            width: 30px;
            height: 1px;
            background: var(--slime);
            opacity: 0.6;
        }

        h1 {
            font-size: 84px;
            font-weight: 700;
            letter-spacing: -0.035em;
            line-height: 1.02;
            max-width: 15ch;
            text-shadow: 0 4px 40px rgba(10, 11, 13, 0.9);
        }
        h1 .accent { color: var(--slime); }

        .sub {
            font-family: 'JetBrains Mono', monospace;
            font-size: 20px;
            color: var(--muted);
            margin-top: 20px;
        }

        .foot {
            display: flex;
            align-items: baseline;
            gap: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 19px;
        }
        .url { color: var(--slime); font-weight: 700; }
        .count { color: var(--faint); font-size: 15px; }
    </style>
</head>
