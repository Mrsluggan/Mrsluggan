<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — no snails found</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/snail.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg: #0a0b0d;
            --panel: #14171c;
            --border: #262b33;
            --text: #ece9e2;
            --muted: #a2a8b2;
            --slime: #b6f04a;
            --slime-glow: rgba(182, 240, 74, 0.16);
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            background:
                radial-gradient(900px 520px at 78% -8%, rgba(182,240,74,0.08), transparent 60%),
                var(--bg);
            color: var(--text);
            font-family: 'Space Grotesk', system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            text-align: center;
        }
        .wrap { max-width: 440px; }
        .code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--slime);
            margin-bottom: 1.2rem;
        }
        .art {
            font-family: 'JetBrains Mono', monospace;
            white-space: pre;
            color: var(--muted);
            font-size: 0.8rem;
            line-height: 1.35;
            margin: 0 0 1.6rem;
            text-align: left;
            display: inline-block;
        }
        h1 { font-size: clamp(2.4rem, 9vw, 3.6rem); margin: 0 0 0.6rem; letter-spacing: -0.02em; }
        h1 .slime { color: var(--slime); }
        p { color: var(--muted); line-height: 1.6; margin: 0 0 2rem; }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 0.9rem;
            text-decoration: none;
            color: #0a0b0d;
            background: var(--slime);
            padding: 0.75rem 1.3rem;
            border-radius: 9px;
            transition: box-shadow 0.2s, transform 0.2s;
        }
        .btn:hover { box-shadow: 0 8px 30px var(--slime-glow); transform: translateY(-2px); }
        .btn:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
    </style>
</head>
<body>
    <main class="wrap">
        <div class="code">error 404</div>
<pre class="art">      _____
     /     \
    | () () |
     \  ^  /__/
        ‾‾‾‾‾‾</pre>
        <h1>No <span class="slime">snails</span> found</h1>
        <p>
            This page slithered off, or never existed. Even a snail would have
            reached the homepage by now.
        </p>
        <a class="btn" href="/">← back to safety</a>
    </main>
</body>
</html>
