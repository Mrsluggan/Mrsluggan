<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — page not found</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
        /* Self-hosted, same face the main site uses. */
        @font-face {
            font-family: 'Fraunces';
            font-style: normal;
            font-display: swap;
            font-weight: 300 700;
            src: url(/fonts/fraunces-latin.woff2) format('woff2');
        }
        :root {
            --bg: #faf8f3;
            --border: #ddd5c4;
            --text: #211f1a;
            --muted: #5c5648;
            --accent: #a8451f;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Fraunces', Georgia, serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            text-align: center;
        }
        .wrap { max-width: 440px; }
        .mark {
            font-size: 0.85rem;
            font-family: system-ui, sans-serif;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 1.6rem;
            display: block;
        }
        h1 { font-weight: 500; font-size: clamp(2.2rem, 8vw, 3.2rem); margin: 0 0 0.6rem; letter-spacing: -0.02em; }
        h1 .accent { color: var(--accent); font-style: italic; }
        p { color: var(--muted); line-height: 1.6; margin: 0 0 2rem; font-family: system-ui, sans-serif; }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-family: system-ui, sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
            color: var(--bg);
            background: var(--text);
            padding: 0.75rem 1.3rem;
            border-radius: 3px;
            transition: background 0.2s;
        }
        .btn:hover { background: var(--accent); }
        .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    </style>
</head>
<body>
    <main class="wrap">
        <span class="mark">Sluggan AB</span>
        <h1>Page not <span class="accent">found</span></h1>
        <p>
            This page doesn't exist, or has moved. Head back to the homepage to
            find what you're looking for.
        </p>
        <a class="btn" href="/">← Back to Sluggan AB</a>
    </main>
</body>
</html>
