<!doctype html>
<!-- Template for /projekt/<slug>/. scripts/prerender.mjs fills the __PLACEHOLDERS__
     once per project in content/projekt/ and then removes this folder from dist. -->
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>__TITLE__ — Sluggan</title>
    <meta name="description" content="__DESCRIPTION__" />

    <link rel="canonical" href="__URL__" />
    <meta name="geo.region" content="SE-C" />
    <meta name="geo.placename" content="Uppsala" />

    <!-- Open Graph -->
    <meta property="og:title" content="__TITLE__ — Sluggan" />
    <meta property="og:description" content="__DESCRIPTION__" />
    <meta name="theme-color" content="#f6f1e6" />
    <meta property="og:type" content="article" />
    <meta property="og:url" content="__URL__" />
    <meta property="og:site_name" content="Sluggan" />
    <meta property="og:locale" content="sv_SE" />
    <meta property="og:image" content="__IMAGE__" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="__IMAGE__" />

    <link rel="preload" href="/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/newsreader-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/fraunces-latin-italic.woff2" as="font" type="font/woff2" crossorigin />

    <script type="application/ld+json">__JSONLD__</script>

    <noscript>
      <!-- .reveal fades in on scroll, so without JS it stays at opacity 0 -->
      <style>.reveal { opacity: 1 !important; transform: none !important; }</style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main-case.tsx"></script>
  </body>
</html>
