    <script type="application/ld+json">
    {
          "@context": "https://schema.org",
          "@type": "FAQPage",
          "mainEntity": [
                {
                      "@type": "Question",
                      "name": "Vad kostar det?",
                      "acceptedAnswer": {
                            "@type": "Answer",
                            "text": "Beror helt på omfattningen. En enkel webbplats kostar betydligt mindre än en skräddarsydd app med inloggning och backend. Hör av dig så får du en kostnadsfri offert med ett fast pris, innan något börjar byggas."
                      }
                },
                {
                      "@type": "Question",
                      "name": "Hur lång tid tar det?",
                      "acceptedAnswer": {
                            "@type": "Answer",
                            "text": "En enkel webbplats tar ofta ett par veckor. Något med backend, konton eller en mobilapp tar längre tid. Du får en realistisk tidsplan som en del av planen."
                      }
                },
                {
                      "@type": "Question",
                      "name": "Bygger ni för både iOS och Android?",
                      "acceptedAnswer": {
                            "@type": "Answer",
                            "text": "Ja. Beroende på projektet används React Native eller liknande verktyg så en kodbas täcker båda, eller nativ utveckling om det passar bättre."
                      }
                },
                {
                      "@type": "Question",
                      "name": "Jag har ingen tydlig idé än, är det ett problem?",
                      "acceptedAnswer": {
                            "@type": "Answer",
                            "text": "Inte alls. De flesta projekt börjar som en lös idé som formas till något konkret tillsammans innan någon kod skrivs."
                      }
                },
                {
                      "@type": "Question",
                      "name": "Kan ni ta över eller förbättra något som redan finns?",
                      "acceptedAnswer": {
                            "@type": "Answer",
                            "text": "Ja — en webbplats eller app som någon annan byggt, en du byggt själv, eller något som fastnat halvvägs."
                      }
                },
                {
                      "@type": "Question",
                      "name": "Måste jag skriva på ett långt avtal?",
                      "acceptedAnswer": {
                            "@type": "Answer",
                            "text": "Nej. Arbetet avgränsas och prissätts per projekt, inte som ett löpande uppdrag."
                      }
                },
                {
                      "@type": "Question",
                      "name": "Tänk om det bara är ett litet jobb, som en sida?",
                      "acceptedAnswer": {
                            "@type": "Answer",
                            "text": "Det är helt okej. Små och enstaka jobb är välkomna, inte bara stora byggen."
                      }
                }
          ]
    }
    </script>
